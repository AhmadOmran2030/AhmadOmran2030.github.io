@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#192032;--text:#eef1f8;--muted:#9aa4ba;--accent:#5aa9f5;--border:#2a3350}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}

body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:28px 18px}
main{width:100%;max-width:460px}
header{text-align:center;margin-bottom:22px}
.avatar{width:80px;height:80px;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:8px auto 14px}
h1{font-size:22px;line-height:1.3;margin:0 0 6px}
.role{margin:0;color:var(--accent);font-weight:600;font-size:15px}
.info{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px 16px;margin-bottom:22px}
.row{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:14.5px}
.row:last-child{border-bottom:0}
.k{flex:none;width:78px;color:var(--muted)}
.v{flex:1;word-break:break-word;font-weight:500}
.v a{color:var(--accent);text-decoration:none}
a.btn{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px 18px;margin-bottom:12px;color:var(--text);text-decoration:none;transition:transform .15s,border-color .15s}
a.btn:hover,a.btn:focus-visible{transform:translateY(-2px);border-color:var(--accent)}
.ic{flex:none;width:42px;height:42px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.t{font-weight:600;font-size:16px}
.arrow{margin-left:auto;color:var(--muted);font-size:20px}
