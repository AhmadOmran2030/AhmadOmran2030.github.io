<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahmad Hassan Muhammad Hafez Omran – Junior Data Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f9;--card:#ffffff;--text:#0f1b33;--muted:#64708a;--accent:#1d4ed8;--accent2:#0ea5e9;--border:#e1e7f2;--shadow:0 10px 30px rgba(15,27,51,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1c;--card:#131a2c;--text:#eef2fb;--muted:#93a0bb;--accent:#60a5fa;--accent2:#38bdf8;--border:#233052;--shadow:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0a0f1c;--card:#131a2c;--text:#eef2fb;--muted:#93a0bb;--accent:#60a5fa;--accent2:#38bdf8;--border:#233052;--shadow:0 10px 30px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px 16px 32px}
main{width:100%;max-width:440px;background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--border);align-self:flex-start}
.cover{height:156px;background:linear-gradient(135deg,#0b1f4d 0%,#1d4ed8 55%,#0ea5e9 100%);position:relative;padding:16px 14px 0}
.cover::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(60deg,rgba(255,255,255,.045) 0 1px,transparent 1px 22px),radial-gradient(circle at 88% 12%,rgba(255,255,255,.28),transparent 45%)}
.logos{position:relative;display:flex;align-items:center;justify-content:space-evenly;height:76px;background:#fff;border-radius:18px;box-shadow:0 8px 22px rgba(4,12,40,.35);padding:0 10px}
.logos img{display:block;width:auto;object-fit:contain}
.logos .l1{height:52px}.logos .l2{height:64px}.logos .l3{height:56px}
.logos i{width:1px;height:38px;background:#e1e7f2}
.profile{text-align:center;padding:0 22px;margin-top:-44px;position:relative}
.avatar{width:104px;height:104px;border-radius:50%;margin:0 auto 14px;border:4px solid var(--card);background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 6px 18px rgba(15,27,51,.2)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:clamp(12px,3.8vw,18px);line-height:1.3;margin:0 0 10px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.chip{display:inline-block;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.body{padding:22px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 10px 4px}
.info{border:1px solid var(--border);border-radius:16px;padding:4px 14px;margin-bottom:22px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.ri{flex:none;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ri svg,.bi svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rt{min-width:0}
.rk{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.rv{display:block;font-size:14.5px;font-weight:600;word-break:break-word}
.rv a{color:inherit;text-decoration:none}
a.btn{display:flex;align-items:center;gap:14px;padding:15px 16px;margin-bottom:12px;border-radius:16px;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--border);transition:transform .15s,box-shadow .15s,border-color .15s}
a.btn:hover,a.btn:focus-visible{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
a.btn.primary{background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:#fff;border-color:transparent}
.bi{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
a.btn.primary .bi{background:rgba(255,255,255,.2);color:#fff}
.bt{font-weight:600;font-size:16px}
.ch{margin-left:auto;opacity:.6}
.ch svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
</style>
</head>
